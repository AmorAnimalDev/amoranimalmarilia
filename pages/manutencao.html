<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manutenção - ONG Amor Animal Marília</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="stylesheet" href="../static/css/icons/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="../static/css/favicon/ong.ico">
  <style>
  .manutencao-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
  .manutencao-container h1 { margin-bottom: 0.25rem; }
  .manutencao-container > p { color: var(--muted-color); margin-bottom: 2rem; }

  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .status-card {
    background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 8px;
    padding: 1.2rem; text-align: center; transition: border-color 0.3s;
  }
  .status-card.ok { border-left: 4px solid #22c55e; }
  .status-card.error { border-left: 4px solid #ef4444; }
  .status-card.pending { border-left: 4px solid #eab308; }
  .status-card-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .status-card-label { font-size: 0.8rem; color: var(--muted-color); margin-bottom: 0.25rem; }
  .status-card-value { font-size: 1rem; font-weight: 600; }
  .status-card-value.ok { color: #22c55e; }
  .status-card-value.error { color: #ef4444; }
  .status-card-value.pending { color: #eab308; }

  .check-section { margin-bottom: 2rem; }
  .check-section h2 { font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .check-list { list-style: none; padding: 0; margin: 0; }
  .check-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border-color);
    font-size: 0.9rem;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .check-item-left code { font-size: 0.8rem; color: var(--muted-color); background: var(--bg-alt); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .check-status { font-size: 0.8rem; font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
  .check-status.ok { background: #f0fdf4; color: #16a34a; }
  .check-status.error { background: #fef2f2; color: #dc2626; }
  .check-status.pending { background: #fefce8; color: #a16207; }
  .check-status.cors { background: #fef2f2; color: #dc2626; }

  .btn-check {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 24px; border: none; border-radius: 8px;
    background: var(--brand-teal); color: #fff; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .btn-check:hover { opacity: 0.85; }
  .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-clear {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border: 1px solid var(--border-color); border-radius: 6px;
    background: transparent; color: var(--text-color); font-size: 0.8rem;
    cursor: pointer; margin-left: 8px;
  }
  .btn-clear:hover { background: var(--bg-alt); }

  /* Aba discreta de logs */
  .logs-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 9990;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color);
    background: var(--container-bg); color: var(--muted-color); font-size: 1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12); transition: all 0.3s;
  }
  .logs-toggle:hover { color: var(--brand-teal); border-color: var(--brand-teal); transform: scale(1.05); }
  .logs-toggle .badge-count {
    position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px;
    border-radius: 8px; background: #ef4444; color: #fff; font-size: 0.65rem;
    font-weight: 700; display: none; align-items: center; justify-content: center;
    padding: 0 4px; line-height: 1;
  }
  .logs-toggle .badge-count.visible { display: flex; }

  .logs-panel {
    position: fixed; bottom: 70px; right: 20px; z-index: 9991;
    width: 420px; max-width: calc(100vw - 40px); max-height: 50vh;
    background: var(--container-bg); border: 1px solid var(--border-color);
    border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    display: none; flex-direction: column; overflow: hidden;
  }
  .logs-panel.open { display: flex; }
  .logs-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border-color);
    font-size: 0.85rem; font-weight: 600;
  }
  .logs-panel-header button {
    background: none; border: none; cursor: pointer; color: var(--muted-color);
    font-size: 1.1rem; padding: 0 4px;
  }
  .logs-panel-body {
    flex: 1; overflow-y: auto; padding: 0; font-family: monospace; font-size: 0.78rem;
  }
  .log-entry {
    display: flex; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--border-color);
    align-items: flex-start;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: var(--muted-color); white-space: nowrap; flex-shrink: 0; }
  .log-level {
    font-weight: 700; white-space: nowrap; flex-shrink: 0; padding: 0 5px;
    border-radius: 3px; font-size: 0.7rem; line-height: 1.5;
  }
  .log-level.error { background: #fef2f2; color: #dc2626; }
  .log-level.warn { background: #fefce8; color: #a16207; }
  .log-level.info { background: #f0f9ff; color: #0369a1; }
  .log-level.cors { background: #fef2f2; color: #dc2626; }
  .log-msg { word-break: break-all; color: var(--text-color); }
  .log-empty { text-align: center; padding: 2rem; color: var(--muted-color); font-style: italic; }
  </style>
</head>
<body>

<script>var ROOT='..';</script>
<script src="../components/header.js"></script>
<script src="../static/js/api.js"></script>

<div class="manutencao-container">
  <h1><i class="bi bi-tools"></i> Manutenção</h1>
  <p>Verificação de integridade do sistema e endpoints da API.</p>

  <div style="margin-bottom:1.5rem;">
    <button class="btn-check" id="btn-run-checks" onclick="runAllChecks()">
      <i class="bi bi-play-circle"></i> Executar Verificações
    </button>
  </div>

  <div class="status-grid" id="status-grid">
    <div class="status-card pending" id="card-api">
      <div class="status-card-icon"><i class="bi bi-cloud"></i></div>
      <div class="status-card-label">API Status</div>
      <div class="status-card-value pending" id="val-api">Aguardando...</div>
    </div>
    <div class="status-card pending" id="card-db">
      <div class="status-card-icon"><i class="bi bi-database"></i></div>
      <div class="status-card-label">Banco de Dados</div>
      <div class="status-card-value pending" id="val-db">Aguardando...</div>
    </div>
    <div class="status-card pending" id="card-cors">
      <div class="status-card-icon"><i class="bi bi-shield-check"></i></div>
      <div class="status-card-label">CORS</div>
      <div class="status-card-value pending" id="val-cors">Aguardando...</div>
    </div>
    <div class="status-card pending" id="card-endpoints">
      <div class="status-card-icon"><i class="bi bi-list-check"></i></div>
      <div class="status-card-label">Endpoints</div>
      <div class="status-card-value pending" id="val-endpoints">Aguardando...</div>
    </div>
  </div>

  <div class="check-section" id="section-endpoints">
    <h2><i class="bi bi-diagram-3"></i> Endpoints da API</h2>
    <ul class="check-list" id="endpoints-list"></ul>
  </div>

  <div class="check-section" id="section-pages">
    <h2><i class="bi bi-file-earmark"></i> Páginas do Site</h2>
    <ul class="check-list" id="pages-list"></ul>
  </div>
</div>

<!-- Botão discreto de logs -->
<button class="logs-toggle" id="logs-toggle" title="Logs do sistema">
  <i class="bi bi-terminal"></i>
  <span class="badge-count" id="logs-badge">0</span>
</button>

<!-- Painel de logs -->
<div class="logs-panel" id="logs-panel">
  <div class="logs-panel-header">
    <span><i class="bi bi-terminal"></i> Logs do Sistema</span>
    <button onclick="clearLogs()" title="Limpar logs"><i class="bi bi-trash3"></i></button>
  </div>
  <div class="logs-panel-body" id="logs-body">
    <div class="log-empty">Nenhum log registrado. Execute as verificações.</div>
  </div>
</div>

<script src="../components/footer.js"></script>
<script>
(function() {
  var logs = [];
  var errorCount = 0;

  function addLog(level, msg) {
    var now = new Date();
    var time = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    logs.push({ time: time, level: level, msg: msg });

    var body = document.getElementById('logs-body');
    var empty = body.querySelector('.log-empty');
    if (empty) empty.remove();

    var entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-time">' + time + '</span>' +
      '<span class="log-level ' + level + '">' + level.toUpperCase() + '</span>' +
      '<span class="log-msg">' + msg + '</span>';
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;

    if (level === 'error' || level === 'cors') {
      errorCount++;
      var badge = document.getElementById('logs-badge');
      badge.textContent = errorCount;
      badge.classList.add('visible');
    }
  }

  window.addLog = addLog;

  window.clearLogs = function() {
    logs = [];
    errorCount = 0;
    document.getElementById('logs-body').innerHTML = '<div class="log-empty">Nenhum log registrado.</div>';
    document.getElementById('logs-badge').classList.remove('visible');
  };

  document.getElementById('logs-toggle').addEventListener('click', function() {
    document.getElementById('logs-panel').classList.toggle('open');
  });

  document.addEventListener('click', function(e) {
    var panel = document.getElementById('logs-panel');
    var toggle = document.getElementById('logs-toggle');
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
      panel.classList.remove('open');
    }
  });

  function setCard(id, status, text) {
    var card = document.getElementById('card-' + id);
    var val = document.getElementById('val-' + id);
    card.className = 'status-card ' + status;
    val.className = 'status-card-value ' + status;
    val.textContent = text;
  }

  function setCheckItem(listId, endpoint, status, text) {
    var list = document.getElementById(listId);
    var li = document.createElement('li');
    li.className = 'check-item';
    var statusClass = status === 'ok' ? 'ok' : status === 'cors' ? 'cors' : status === '404' ? 'warn' : 'error';
    li.innerHTML = '<div class="check-item-left"><code>' + endpoint + '</code></div>' +
      '<span class="check-status ' + statusClass + '">' + text + '</span>';
    list.appendChild(li);
  }

  var API = window.API_BASE || 'https://api.projetosdinamicos.com.br/amoranimal';

  var apiEndpoints = [
    '/', '/health', '/transparencia', '/voluntario', '/adocao',
    '/castracao', '/eventos', '/parceria', '/procura_se',
    '/mutirao_pet', '/mutirao_inscricao', '/settings'
  ];

  var sitePages = [
    '../index.html', 'adocao.html', 'castracao.html', 'eventos.html',
    'voluntario.html', 'parceria.html', 'procura_se.html',
    'transparencia.html', 'doacao.html', 'sobre.html'
  ];

  window.runAllChecks = function() {
    errorCount = 0;
    document.getElementById('logs-badge').classList.remove('visible');
    document.getElementById('endpoints-list').innerHTML = '';
    document.getElementById('pages-list').innerHTML = '';
    document.getElementById('logs-body').innerHTML = '<div class="log-empty">Executando verificações...</div>';

    setCard('api', 'pending', 'Verificando...');
    setCard('db', 'pending', 'Verificando...');
    setCard('cors', 'pending', 'Verificando...');
    setCard('endpoints', 'pending', 'Verificando...');

    addLog('info', 'Iniciando verificações do sistema');

    var apiOk = 0;
    var apiFail = 0;
    var corsErrors = 0;
    var fetchPromises = [];

    apiEndpoints.forEach(function(ep) {
      var p = fetch(API + ep, { mode: 'cors' })
        .then(function(r) {
          if (r.status === 200) {
            apiOk++;
            setCheckItem('endpoints-list', ep, 'ok', r.status + ' OK');
            addLog('info', 'GET ' + ep + ' → ' + r.status);
            return ep;
          } else if (r.status === 404) {
            apiFail++;
            setCheckItem('endpoints-list', ep, '404', r.status + ' Não encontrado');
            addLog('warn', 'GET ' + ep + ' → 404 Não encontrado');
            return ep;
          } else {
            apiFail++;
            setCheckItem('endpoints-list', ep, 'error', r.status + ' Erro');
            addLog('error', 'GET ' + ep + ' → ' + r.status);
            return ep;
          }
        })
        .catch(function(err) {
          apiFail++;
          var msg = err.message || 'Erro desconhecido';
          if (msg.indexOf('CORS') !== -1 || msg.indexOf('NetworkError') !== -1 || msg.indexOf('Failed to fetch') !== -1) {
            corsErrors++;
            setCheckItem('endpoints-list', ep, 'cors', 'CORS bloqueado');
            addLog('cors', 'GET ' + ep + ' → CORS bloqueado: ' + msg);
          } else {
            setCheckItem('endpoints-list', ep, 'error', msg);
            addLog('error', 'GET ' + ep + ' → ' + msg);
          }
          return ep;
        });
      fetchPromises.push(p);
    });

    fetch(API + '/health')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.database === 'connected') {
          setCard('db', 'ok', 'Conectado');
          addLog('info', 'Banco de dados: conectado');
        } else {
          setCard('db', 'error', 'Desconectado');
          addLog('error', 'Banco de dados: desconectado');
        }
      })
      .catch(function(err) {
        setCard('db', 'error', 'Indisponível');
        addLog('error', 'Health check falhou: ' + err.message);
      });

    fetch(API + '/', { mode: 'cors' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        setCard('api', 'ok', data.status || 'Online');
        addLog('info', 'API: ' + (data.status || 'Online'));
      })
      .catch(function(err) {
        setCard('api', 'error', 'Offline');
        addLog('error', 'API offline: ' + err.message);
      });

    Promise.all(fetchPromises).then(function() {
      setCard('endpoints', apiFail === 0 ? 'ok' : 'error', apiOk + ' OK / ' + apiFail + ' erro(s)');
      setCard('cors', corsErrors === 0 ? 'ok' : 'error', corsErrors === 0 ? 'Sem erros' : corsErrors + ' bloqueado(s)');
      addLog('info', 'Endpoints: ' + apiOk + ' OK, ' + apiFail + ' com erro, ' + corsErrors + ' CORS');

      addLog('info', 'Verificando páginas do site...');
      var pagePromises = [];
      sitePages.forEach(function(page) {
        var pp = fetch(page, { method: 'HEAD' })
          .then(function(r) {
            if (r.ok) {
              setCheckItem('pages-list', page, 'ok', r.status + ' OK');
              addLog('info', page + ' → ' + r.status);
            } else {
              setCheckItem('pages-list', page, 'error', r.status + ' Erro');
              addLog('warn', page + ' → ' + r.status);
            }
          })
          .catch(function(err) {
            setCheckItem('pages-list', page, 'error', 'Falha');
            addLog('error', page + ' → ' + err.message);
          });
        pagePromises.push(pp);
      });

      Promise.all(pagePromises).then(function() {
        addLog('info', 'Verificações concluídas');
      });
    });
  };

  var originalFetch = window.fetch;
  window.fetch = function() {
    var url = arguments[0];
    var opts = arguments[1] || {};
    return originalFetch.apply(this, arguments).catch(function(err) {
      var msg = err.message || 'Erro de rede';
      var urlStr = typeof url === 'string' ? url : (url.url || '');
      if (msg.indexOf('CORS') !== -1 || msg.indexOf('NetworkError') !== -1 || msg.indexOf('Failed to fetch') !== -1) {
        addLog('cors', 'Requisição bloqueada (CORS): ' + urlStr);
      } else if (msg.indexOf('404') !== -1 || msg.indexOf('Not Found') !== -1) {
        addLog('warn', '404 Não encontrado: ' + urlStr);
      } else {
        addLog('error', 'Erro na requisição: ' + urlStr + ' → ' + msg);
      }
      throw err;
    });
  };

  window.addEventListener('error', function(e) {
    if (e.message && e.message.indexOf('ResizeObserver') === -1) {
      addLog('error', 'Erro JS: ' + (e.message || e.filename || 'desconhecido'));
    }
  });

  window.addEventListener('unhandledrejection', function(e) {
    var reason = e.reason;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    addLog('error', 'Promise rejeitada: ' + msg);
  });
})();
</script>

</body>
</html>
